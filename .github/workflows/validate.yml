name: Validate assets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate metadata, artwork, and manifest
        run: npm run validate

      # A document that states a stale count is wrong in the way that is
      # hardest to notice, because it still looks finished.
      - name: Confirm the documents state the current counts
        run: npm run stats:check

      - name: Confirm the site assembles
        run: node scripts/build-site.mjs
