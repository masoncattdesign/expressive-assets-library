<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customizer — Expressive Assets</title>
<meta name="description" content="Try any asset from the Expressive Assets library against a style, a size, an accent and a surface, all at once.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230078D4'/%3E%3Crect x='6' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='6' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<style>
  /* Customizer sits inside Gallery's shell and borrows every token from it, so
     the two tools read as one product rather than two side projects. */
  .nav a.nav-item { text-decoration: none; }
  /* In Gallery the nav is the long scrolling list. Here it is two links, and
     the controls are what needs the room. */
  .nav { flex: none; }
  .controls { padding: 4px 12px 24px; overflow-y: auto; flex: 1; min-height: 0; }
  .controls h3 {
    font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3); margin: 18px 0 8px;
  }
  .controls .segment { width: 100%; }
  .controls .segment button { flex: 1; padding: 6px 4px; font-size: 12.5px; }
  .hint { font-size: 11.5px; line-height: 1.45; color: var(--text-3); margin: 8px 0 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatches button {
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer; padding: 0;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .swatches button.on { box-shadow: 0 0 0 2px var(--sidebar), 0 0 0 4px var(--text); }
  .swatches button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .pair { display: flex; gap: 8px; margin-top: 10px; }
  .pair label { flex: 1; font-size: 11.5px; color: var(--text-3); display: grid; gap: 4px; }
  .pair input[type="color"] {
    width: 100%; height: 30px; padding: 0; border: 1px solid var(--line);
    border-radius: 7px; background: var(--surface); cursor: pointer;
  }

  .ttl { display: flex; flex-direction: column; line-height: 1.25; }
  .ttl strong { font-size: 15px; }
  .ttl span { font-size: 12px; color: var(--text-3); }
  .spacer { flex: 1; }
  .toolbar .btn { padding: 8px 12px; font-size: 12.5px; }

  /* .content is a flex row (Gallery puts its detail panel beside the grid), so
     the set has to claim the space rather than shrink to its content, and pack
     its rows from the top instead of stretching twelve tiles down the page. */
  .set {
    flex: 1; min-width: 0; overflow-y: auto; align-content: start;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 14px; padding: 20px;
  }
  .slot {
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    overflow: hidden; position: relative; transition: border-color .12s, box-shadow .12s;
  }
  .slot:hover { border-color: var(--accent-ring); box-shadow: var(--shadow); }
  .slot.lit { border-color: var(--selected-ring); box-shadow: 0 0 0 2px var(--selected-ring); }
  .stage {
    height: 128px; display: grid; place-items: center;
    transition: background .15s ease, color .15s ease;
  }
  .stage svg { display: block; }
  .cap {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px 9px 12px; border-top: 1px solid var(--line-soft);
  }
  .cap .who { min-width: 0; display: grid; }
  .cap b { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .sub { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .sub.warn { color: var(--selected-ring); }
  .swap {
    margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2);
    cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .12s;
  }
  .slot:hover .swap, .slot:focus-within .swap { opacity: 1; }
  .swap:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  .swap svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .picker {
    position: fixed; z-index: 60; width: 306px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 10px;
  }
  .picker input {
    width: 100%; font: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
  }
  .picker input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .picker ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 292px; overflow-y: auto; }
  .picker li button {
    width: 100%; text-align: left; font: inherit; font-size: 12.5px; cursor: pointer;
    border: 0; background: none; color: var(--text); border-radius: 8px;
    padding: 7px 9px; display: flex; align-items: baseline; gap: 8px;
  }
  .picker li button:hover, .picker li button.cursor { background: var(--accent-soft); }
  .picker li button .id { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .picker .none { font-size: 12.5px; color: var(--text-3); padding: 10px 9px; }
  .scrim { position: fixed; inset: 0; z-index: 55; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="5" y="13.4" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="13.4" width="5.6" height="5.6" rx="1.6"/></svg>
      </div>
      <div class="brand-text">
        <strong>Expressive Assets</strong>
        <span>Windows Design Systems</span>
      </div>
    </div>

    <nav class="nav" aria-label="Tools">
      <div class="nav-group">Tools</div>
      <a class="nav-item" href="index.html">Gallery</a>
      <a class="nav-item on" href="customizer.html" aria-current="page">Customizer</a>
    </nav>

    <div class="controls" id="controls"></div>

    <div class="sidebar-foot">
      <button class="btn block" id="reset" type="button">Reset to the pilot set</button>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="ttl">
        <strong>Customizer</strong>
        <span id="sub">Loading the library…</span>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="share" type="button">Copy link to this set</button>
      <a class="btn" href="index.html">Open Gallery</a>
    </header>
    <div class="content">
      <div class="set" id="set"></div>
    </div>
  </main>
</div>

<script>
/**
 * Customizer — the theming tool for Expressive Assets.
 *
 * Gallery answers "what do we have". Customizer answers "what does it look like
 * in MY theme", which is the question a designer actually arrives with. It
 * holds a set of twelve assets and applies one style, size, accent and surface
 * across all of them at once, because a colour decision is made against a set
 * and never against a single icon.
 *
 * Any of the twelve can be swapped for anything in the library: right-click a
 * tile, or use the swap button that appears on hover.
 *
 * Reads manifest.json, the same public contract Gallery reads. No build step.
 */

/** The anatomy pilot group — the twelve product icons the anatomy work is being
 *  proved on, so both threads stay pointed at the same artwork. */
const PILOT = [
  'product.word', 'product.excel', 'product.powerpoint', 'product.onenote',
  'product.teams', 'product.outlook', 'product.sharepoint', 'product.copilot',
  'product.edge', 'product.microsoft', 'product.swiftkey', 'product.github',
];

const STYLES = [
  { key: 'standard', label: 'Standard' },
  { key: 'outline', label: 'Outline' },
  { key: 'filled', label: 'Filled' },
];

const SIZES = [16, 20, 24, 28, 32, 48];

const ACCENTS = [
  { id: 'default', label: 'Asset default', primary: null, secondary: null },
  { id: 'blue', label: 'Windows blue', primary: '#0078D4', secondary: '#2AA0DA' },
  { id: 'purple', label: 'Purple', primary: '#8764B8', secondary: '#C239B3' },
  { id: 'green', label: 'Green', primary: '#107C10', secondary: '#4CAF50' },
  { id: 'teal', label: 'Teal', primary: '#038387', secondary: '#38C6C6' },
  { id: 'red', label: 'Red', primary: '#D13438', secondary: '#E74856' },
  { id: 'orange', label: 'Orange', primary: '#CA5010', secondary: '#F7A501' },
  { id: 'magenta', label: 'Magenta', primary: '#E3008C', secondary: '#C239B3' },
];

/** Surfaces worth checking artwork against, rather than a colour wheel: the two
 *  Windows grounds, plus the extremes that break things. */
const SURFACES = [
  { id: 'light', label: 'Light', value: '#FFFFFF' },
  { id: 'subtle', label: 'Subtle', value: '#F3F3F3' },
  { id: 'dark', label: 'Dark', value: '#202329' },
  { id: 'black', label: 'Black', value: '#0B0C0E' },
  { id: 'accent', label: 'Accent', value: '#0078D4' },
];

const state = {
  slots: PILOT.slice(),
  style: 'standard',
  size: 48,
  accent: 'default',
  custom: { primary: '#8B52F4', secondary: '#F83F54' },
  surface: 'light',
  surfaceCustom: '#FFFFFF',
  lit: -1,
};

let manifest = null;
const byId = new Map();
const cache = new Map();

const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

/* ---------------------------------------------------------------- */
/* Drawings                                                          */
/* ---------------------------------------------------------------- */

/** Which style this asset can actually show. A file icon has no Outline yet and
 *  a system icon has no Standard at all, so the set falls back per asset and
 *  says so on the tile rather than quietly showing something else. */
function styleFor(asset) {
  if (!asset) return null;
  if (asset.themes.includes(state.style)) return state.style;
  for (const s of ['standard', 'filled', 'outline']) if (asset.themes.includes(s)) return s;
  return asset.themes[0];
}

/** Windows artwork is redrawn per size, so ask for the exact size first. */
function drawingPath(asset, style, size) {
  const files = asset.variants && asset.variants[style];
  if (!files) return null;
  if (files[size]) return files[size];
  if (files.any) return files.any;
  const nums = Object.keys(files).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
  if (!nums.length) return Object.values(files)[0] || null;
  const below = nums.filter((n) => n <= size).pop();
  return files[below !== undefined ? below : nums[nums.length - 1]];
}

async function load(path) {
  if (!path) return null;
  if (cache.has(path)) return cache.get(path);
  try {
    const res = await fetch(path);
    const text = res.ok ? await res.text() : null;
    cache.set(path, text);
    return text;
  } catch {
    cache.set(path, null);
    return null;
  }
}

/* ---------------------------------------------------------------- */
/* Colour                                                            */
/* ---------------------------------------------------------------- */

const HEX = '#[0-9A-Fa-f]{6}';

function lighten(hex, toward) {
  const m = hex.match(/^#([0-9a-f]{6})$/i);
  if (!m) return hex;
  const parts = [0, 2, 4].map((i) => {
    const c = parseInt(m[1].slice(i, i + 2), 16);
    return Math.round(c + (255 - c) * toward);
  });
  return '#' + parts.map((c) => c.toString(16).padStart(2, '0')).join('');
}

function luminance(hex) {
  const m = hex.match(/^#([0-9a-f]{6})$/i);
  if (!m) return 1;
  const c = [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));
  return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
}

/** Artwork with no tint hooks keeps its own colours — a brand mark ships as
 *  authored or not at all. */
function tintable(source, asset) {
  if (asset.recolorable === false || !source) return false;
  return source.includes('--ea-primary') || source.includes('currentColor');
}

/** Bake the chosen colours into a source string. Everything resolves into ONE
 *  style attribute: a second one is invalid markup and browsers drop it. */
function tint(source, opts) {
  const ink = opts.ink;
  const inkSecondary = opts.inkSecondary;
  const size = opts.size;
  let out = source;
  if (ink) out = out.replace(new RegExp('--ea-primary:' + HEX), '--ea-primary:' + ink);
  if (inkSecondary) out = out.replace(new RegExp('--ea-secondary:' + HEX), '--ea-secondary:' + inkSecondary);

  const decls = [];
  if (ink && out.includes('currentColor')) decls.push('color:' + ink);
  if (ink && out.includes('var(--ea-primary,')) {
    const second = inkSecondary || ink;
    decls.push(
      '--ea-primary:' + ink,
      '--ea-primary-tint:' + lighten(ink, 0.72),
      '--ea-secondary:' + second,
      '--ea-tint:' + lighten(second, 0.8)
    );
  }
  if (decls.length && !/<svg[^>]*\sstyle=/.test(out)) {
    out = out.replace('<svg ', '<svg style="' + decls.join(';') + '" ');
  }
  if (size) out = out.replace(/width="\d+"\s+height="\d+"/, 'width="' + size + '" height="' + size + '"');
  return out;
}

function accentNow() {
  if (state.accent === 'custom') {
    return { id: 'custom', primary: state.custom.primary, secondary: state.custom.secondary };
  }
  return ACCENTS.find((a) => a.id === state.accent) || ACCENTS[0];
}

function surfaceNow() {
  if (state.surface === 'custom') return state.surfaceCustom;
  const found = SURFACES.find((s) => s.id === state.surface);
  return found ? found.value : SURFACES[0].value;
}

/** Monochrome artwork with no accent applied inherits the surface, which is the
 *  whole point of a monochrome style: near-black on light, near-white on dark. */
function inkForSurface() {
  return luminance(surfaceNow()) > 0.55 ? '#16181D' : '#F2F4F7';
}

function svgNode(source, size) {
  const wrap = document.createElement('div');
  wrap.innerHTML = source;
  const svg = wrap.firstElementChild;
  if (svg && size) {
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
  }
  return svg;
}

/* ---------------------------------------------------------------- */
/* Controls                                                          */
/* ---------------------------------------------------------------- */

function segment(options, current, onPick) {
  const seg = el('div', { className: 'segment', role: 'group' });
  for (const opt of options) {
    const btn = el('button', {
      type: 'button',
      textContent: opt.label,
      className: current === opt.key ? 'on' : '',
    });
    btn.setAttribute('aria-pressed', String(current === opt.key));
    btn.addEventListener('click', () => onPick(opt.key));
    seg.append(btn);
  }
  return seg;
}

function renderControls() {
  const box = $('#controls');
  box.replaceChildren();

  box.append(el('h3', { textContent: 'Style' }));
  box.append(segment(STYLES, state.style, (k) => { state.style = k; save(); renderControls(); renderSet(); }));
  box.append(el('p', { className: 'hint', textContent: 'Applied to every asset that has it. Anything that does not is marked on its tile.' }));

  box.append(el('h3', { textContent: 'Size' }));
  box.append(segment(SIZES.map((s) => ({ key: s, label: String(s) })), state.size, (k) => { state.size = k; save(); renderControls(); renderSet(); }));

  box.append(el('h3', { textContent: 'Accent' }));
  const swatches = el('div', { className: 'swatches' });
  for (const accent of ACCENTS) {
    const isDefault = accent.id === 'default';
    const btn = el('button', {
      type: 'button',
      className: state.accent === accent.id ? 'on' : '',
      title: isDefault ? 'Asset default' : accent.label,
      ariaLabel: accent.label,
      style: isDefault
        ? 'background:linear-gradient(135deg, var(--text), var(--text-3))'
        : 'background:linear-gradient(135deg, ' + accent.primary + ', ' + accent.secondary + ')',
    });
    btn.addEventListener('click', () => { state.accent = accent.id; save(); renderControls(); renderSet(); });
    swatches.append(btn);
  }
  const custom = el('button', {
    type: 'button',
    className: state.accent === 'custom' ? 'on' : '',
    title: 'Custom pair',
    ariaLabel: 'Custom pair',
    style: 'background:linear-gradient(135deg, ' + state.custom.primary + ', ' + state.custom.secondary + ')',
  });
  custom.addEventListener('click', () => { state.accent = 'custom'; save(); renderControls(); renderSet(); });
  swatches.append(custom);
  box.append(swatches);

  const pair = el('div', { className: 'pair' });
  for (const key of ['primary', 'secondary']) {
    const label = el('label', { textContent: key === 'primary' ? 'Primary' : 'Secondary' });
    const input = el('input', { type: 'color', value: state.custom[key] });
    input.addEventListener('input', () => {
      state.custom[key] = input.value;
      state.accent = 'custom';
      save();
      renderSet();
      custom.className = 'on';
      custom.style.background = 'linear-gradient(135deg, ' + state.custom.primary + ', ' + state.custom.secondary + ')';
    });
    label.append(input);
    pair.append(label);
  }
  box.append(pair);
  box.append(el('p', { className: 'hint', textContent: 'Standard artwork ships in brand colours and ignores an accent. Outline and Filled take it.' }));

  box.append(el('h3', { textContent: 'Surface' }));
  const surfaces = el('div', { className: 'swatches' });
  for (const s of SURFACES) {
    const btn = el('button', {
      type: 'button',
      className: state.surface === s.id ? 'on' : '',
      title: s.label,
      ariaLabel: s.label,
      style: 'background:' + s.value + ';border-color:var(--line)',
    });
    btn.addEventListener('click', () => { state.surface = s.id; save(); renderControls(); renderSet(); });
    surfaces.append(btn);
  }
  const cs = el('button', {
    type: 'button',
    className: state.surface === 'custom' ? 'on' : '',
    title: 'Custom surface',
    ariaLabel: 'Custom surface',
    style: 'background:' + state.surfaceCustom,
  });
  cs.addEventListener('click', () => { state.surface = 'custom'; save(); renderControls(); renderSet(); });
  surfaces.append(cs);
  box.append(surfaces);

  const spair = el('div', { className: 'pair' });
  const slabel = el('label', { textContent: 'Custom surface' });
  const sinput = el('input', { type: 'color', value: state.surfaceCustom });
  sinput.addEventListener('input', () => {
    state.surfaceCustom = sinput.value;
    state.surface = 'custom';
    save();
    renderSet();
    cs.className = 'on';
    cs.style.background = state.surfaceCustom;
  });
  slabel.append(sinput);
  spair.append(slabel);
  box.append(spair);
}

/* ---------------------------------------------------------------- */
/* The set                                                           */
/* ---------------------------------------------------------------- */

function renderSet() {
  const set = $('#set');
  set.replaceChildren();
  const ground = surfaceNow();
  const ink = inkForSurface();

  state.slots.forEach((id, i) => {
    const asset = byId.get(id);
    const slot = el('div', { className: 'slot' + (state.lit === i ? ' lit' : '') });
    slot.dataset.index = String(i);

    const stage = el('div', { className: 'stage' });
    stage.style.background = ground;
    stage.style.color = ink;
    slot.append(stage);

    const cap = el('div', { className: 'cap' });
    const who = el('div', { className: 'who' });
    who.append(el('b', { textContent: asset ? asset.name : id }));
    const sub = el('span', { className: 'sub' });
    who.append(sub);
    cap.append(who);

    const swap = el('button', {
      className: 'swap',
      type: 'button',
      title: 'Swap this asset (or right-click the tile)',
      ariaLabel: 'Swap ' + (asset ? asset.name : id),
    });
    swap.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>';
    swap.addEventListener('click', (e) => {
      e.stopPropagation();
      const r = swap.getBoundingClientRect();
      openPicker(i, r.left - 260, r.bottom + 6);
    });
    cap.append(swap);
    slot.append(cap);

    slot.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      openPicker(i, e.clientX, e.clientY);
    });

    set.append(slot);

    if (!asset) {
      sub.textContent = 'Not in the library';
      sub.classList.add('warn');
      return;
    }

    const style = styleFor(asset);
    sub.textContent = style === state.style ? asset.id : style + ', no ' + state.style + ' drawn';
    sub.classList.toggle('warn', style !== state.style);

    const path = drawingPath(asset, style, state.size);
    load(path).then((src) => {
      if (!src || !set.contains(slot)) return;
      const accent = accentNow();
      const canTint = tintable(src, asset) && Boolean(accent.primary);
      const node = svgNode(
        tint(src, {
          ink: canTint ? accent.primary : null,
          inkSecondary: canTint ? accent.secondary : null,
          size: state.size,
        }),
        state.size
      );
      if (node) stage.replaceChildren(node);
    });
  });

  $('#sub').textContent = state.slots.length + ' assets · any of ' + manifest.total.toLocaleString() + ' in the library';
}

/* ---------------------------------------------------------------- */
/* Picker                                                            */
/* ---------------------------------------------------------------- */

let picker = null;
let scrim = null;

function closePicker() {
  if (picker) picker.remove();
  if (scrim) scrim.remove();
  picker = null;
  scrim = null;
}

function openPicker(index, x, y) {
  closePicker();
  scrim = el('div', { className: 'scrim' });
  scrim.addEventListener('mousedown', closePicker);
  scrim.addEventListener('contextmenu', (e) => { e.preventDefault(); closePicker(); });
  document.body.append(scrim);

  picker = el('div', { className: 'picker' });
  const input = el('input', { type: 'search', placeholder: 'Search all ' + manifest.total.toLocaleString() + ' assets…' });
  input.setAttribute('aria-label', 'Search the library');
  const list = el('ul');
  picker.append(input, list);
  document.body.append(picker);

  // Keep it on screen: a tile near the right edge would otherwise open a panel
  // that runs off it.
  const left = Math.max(12, Math.min(x, window.innerWidth - 306 - 12));
  const top = Math.max(12, Math.min(y, window.innerHeight - 372));
  picker.style.left = left + 'px';
  picker.style.top = top + 'px';

  let cursor = 0;
  let results = [];

  function paint() {
    list.replaceChildren();
    if (!results.length) {
      list.append(el('li', {}, el('div', { className: 'none', textContent: 'Nothing matches that.' })));
      return;
    }
    results.forEach((a, i) => {
      const btn = el('button', { type: 'button', className: i === cursor ? 'cursor' : '' });
      btn.append(el('span', { textContent: a.name }), el('span', { className: 'id', textContent: a.id }));
      btn.addEventListener('click', () => pick(a));
      list.append(el('li', {}, btn));
    });
  }

  function search(q) {
    const needle = q.trim().toLowerCase();
    const all = manifest.assets;
    const hits = needle
      ? all.filter((a) =>
          a.id.includes(needle) ||
          a.name.toLowerCase().includes(needle) ||
          (a.keywords || []).some((k) => k.includes(needle)))
      : all.filter((a) => a.collection === 'product');
    results = hits.slice(0, 60);
    cursor = 0;
    paint();
  }

  function pick(asset) {
    state.slots[index] = asset.id;
    state.lit = index;
    save();
    closePicker();
    renderSet();
    setTimeout(() => { state.lit = -1; renderSet(); }, 1600);
  }

  input.addEventListener('input', () => search(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closePicker(); return; }
    if (e.key === 'ArrowDown') { cursor = Math.min(cursor + 1, results.length - 1); paint(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { cursor = Math.max(cursor - 1, 0); paint(); e.preventDefault(); }
    if (e.key === 'Enter' && results[cursor]) pick(results[cursor]);
  });

  search('');
  input.focus();
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

/* ---------------------------------------------------------------- */
/* Persistence and sharing                                           */
/* ---------------------------------------------------------------- */

const KEY = 'expressive-assets-customizer';

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      slots: state.slots, style: state.style, size: state.size,
      accent: state.accent, custom: state.custom,
      surface: state.surface, surfaceCustom: state.surfaceCustom,
    }));
  } catch (e) { /* private window, or storage refused. The set still works. */ }
}

function restore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.slots) && saved.slots.length) state.slots = saved.slots;
    for (const k of ['style', 'size', 'accent', 'surface', 'surfaceCustom']) {
      if (saved[k] !== undefined) state[k] = saved[k];
    }
    if (saved.custom) state.custom = saved.custom;
  } catch (e) { /* nothing saved, or unreadable. Start from the pilot set. */ }
}

/** A link that rebuilds this exact set on someone else's screen, which is the
 *  thing you actually want to paste into a review. */
function shareLink() {
  const p = new URLSearchParams();
  p.set('set', state.slots.join(','));
  p.set('style', state.style);
  p.set('size', String(state.size));
  p.set('accent', state.accent);
  if (state.accent === 'custom') p.set('pair', state.custom.primary + ',' + state.custom.secondary);
  p.set('surface', state.surface === 'custom' ? state.surfaceCustom : state.surface);
  return location.origin + location.pathname + '?' + p.toString();
}

function applyURL() {
  const p = new URLSearchParams(location.search);
  const set = p.get('set');
  if (set) state.slots = set.split(',').filter(Boolean);
  if (p.get('style')) state.style = p.get('style');
  if (p.get('size')) state.size = Number(p.get('size'));
  if (p.get('accent')) state.accent = p.get('accent');
  if (p.get('pair')) {
    const parts = p.get('pair').split(',');
    if (parts[0]) state.custom.primary = parts[0];
    if (parts[1]) state.custom.secondary = parts[1];
  }
  const surface = p.get('surface');
  if (surface) {
    if (SURFACES.some((s) => s.id === surface)) state.surface = surface;
    else { state.surface = 'custom'; state.surfaceCustom = surface; }
  }
  // Gallery links here with a single asset. Drop it into the first slot and
  // light it up, so the thing you clicked is the thing you see.
  const one = p.get('asset');
  if (one) {
    state.slots = state.slots.filter((id) => id !== one);
    state.slots.unshift(one);
    state.slots = state.slots.slice(0, 12);
    state.lit = 0;
  }
}

/* ---------------------------------------------------------------- */
/* Boot                                                              */
/* ---------------------------------------------------------------- */

async function boot() {
  restore();
  applyURL();

  try {
    const res = await fetch('manifest.json');
    manifest = await res.json();
  } catch (e) {
    $('#sub').textContent = 'Could not read manifest.json. Serve this over http rather than opening the file directly.';
    return;
  }
  for (const a of manifest.assets) byId.set(a.id, a);

  renderControls();
  renderSet();

  $('#reset').addEventListener('click', () => {
    state.slots = PILOT.slice();
    state.lit = -1;
    save();
    renderSet();
  });

  $('#share').addEventListener('click', async () => {
    const url = shareLink();
    try {
      await navigator.clipboard.writeText(url);
      $('#share').textContent = 'Link copied';
      setTimeout(() => { $('#share').textContent = 'Copy link to this set'; }, 1600);
    } catch (e) {
      history.replaceState(null, '', url);
      $('#share').textContent = 'Link is in the address bar';
      setTimeout(() => { $('#share').textContent = 'Copy link to this set'; }, 2400);
    }
  });
}

boot();
</script>
