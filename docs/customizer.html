<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Customizer &mdash; Expressive Assets</title>
<meta name="description" content="Apply an icon style across a set of Expressive Assets and tune it: palette, stroke, texture, surface.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230078D4'/%3E%3Crect x='6' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='6' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="chrome.js"></script>
<script>applyStoredTheme();</script>
<style>
/* ── HEADER ── */




.m365-lock{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);padding:5px 10px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;user-select:none;transition:all .15s}
.export-btn{font-size:11px;color:var(--text2);padding:5px 12px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:transparent;font-family:var(--font);transition:all .15s}
.export-btn:hover{border-color:var(--accent-ring);color:var(--text)}
.m365-lock:hover{border-color:var(--accent-ring)}
.m365-lock.locked{border-color:var(--accent);color:var(--accent)}
.lock-icon{font-size:12px}
.ctl-label{font-size:11px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;font-weight:650}
.preview-bg-toggle{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:20px;padding:3px}
.bg-btn{font-size:11px;padding:4px 10px;border-radius:16px;cursor:pointer;color:var(--text2);border:none;background:none;font-family:var(--font);transition:all .12s}
.bg-btn.active{background:var(--surface3);color:var(--text)}

/* ── MAIN LAYOUT ── */


/* ── LEFT SIDEBAR — MODE SELECTOR ── */

.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 4px;margin-bottom:4px;margin-top:4px}
.mode-card{
  border-radius:12px;border:1.5px solid var(--border2);background:var(--surface);
  cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .15s,background .15s;position:relative;text-align:left;
  /* A flex item shrinks by default, and in a scrolling column that crops the
     description off the bottom of every card. */
  flex:none;width:100%;font:inherit;color:inherit
}
.mode-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode-card:hover{border-color:var(--accent-ring)}
.mode-card.active{border-color:var(--accent);background:var(--surface2)}
/* Selection reads off the left rail rather than a tick in the corner: the
   corner is where the preview is, and a tick there competes with the artwork
   it is meant to be describing. */
.mode-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:0;transition:opacity .15s
}
.mode-card.active::before{opacity:1}
.mode-check{display:none}
.mode-thumb{
  height:62px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--surface2);flex-shrink:0;border-bottom:1px solid var(--border2)
}
.mode-card.active .mode-thumb{background:var(--surface)}
.mode-thumb svg{width:30px;height:30px}
.mode-text{padding:9px 11px 11px 13px;display:flex;flex-direction:column;gap:2px}
.mode-name{font-size:12.5px;font-weight:600;color:var(--text)}
.mode-desc{font-size:10.5px;color:var(--text3);line-height:1.35}

/* ── CENTER — PREVIEW ── */

.preview-pane{flex:1;display:flex;align-items:center;justify-content:center;transition:background .3s;position:relative;overflow:hidden}
.preview-pane.dark-bg{background:#1a1a1f;--ea-knockout:#1a1a1f}
.preview-pane.light-bg{background:#EFEFED;--ea-knockout:#EFEFED}
.preview-grid-wrap{display:flex;flex-direction:column;gap:0;width:100%;max-width:680px;padding:32px}
/* These controls sit on the canvas now, so they take their colors from the
   canvas rather than from the toolbar they came out of. Both grounds get an
   explicit pair: a control tuned for the light chrome disappears on #1a1a1f. */
.canvas-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
/* Scoped to the pane rather than to the toolbar group: everything sitting on
   the canvas follows the canvas's own Dark/Light control, not the page theme.
   Scoped to .canvas-tools, a control placed anywhere else on the canvas fell
   back to the page tokens and painted a white pill on a dark canvas. */
.preview-pane .preview-bg-toggle{background:rgba(255,255,255,.09);padding:3px}
.preview-pane .bg-btn{color:rgba(255,255,255,.62)}
.preview-pane .bg-btn:hover{color:#fff}
.preview-pane .bg-btn.active{background:rgba(255,255,255,.92);color:#1a1a1f;font-weight:600}
.preview-pane .export-btn{color:rgba(255,255,255,.72);border-color:rgba(255,255,255,.22)}
.preview-pane .export-btn:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.light-bg .preview-bg-toggle{background:rgba(0,0,0,.06)}
.light-bg .bg-btn{color:rgba(30,30,40,.6)}
.light-bg .bg-btn:hover{color:#101014}
.light-bg .bg-btn.active{background:#fff;color:#101014}
.light-bg .export-btn{color:rgba(30,30,40,.72);border-color:rgba(0,0,0,.18)}
.light-bg .export-btn:hover{color:#101014;border-color:rgba(0,0,0,.4)}
.row-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(128,128,140,0.6);margin-bottom:8px;padding-left:2px;display:flex;align-items:center;gap:8px}
.light-bg .row-label{color:rgba(80,80,100,0.5)}
.row-lock-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:rgba(124,110,247,0.15);color:var(--accent);border:1px solid rgba(124,110,247,0.25)}
.m365-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border2);border-radius:10px;padding:2px;gap:2px}
.m365-toggle-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(128,128,140,0.55);margin-left:4px}
.light-bg .m365-toggle-label{color:rgba(80,80,100,0.5)}
.light-bg .m365-toggle{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08)}
.m365-tog-btn{font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:7px;border:none;background:transparent;color:rgba(128,128,140,0.65);cursor:pointer;font-family:var(--font);transition:all .12s}
.m365-tog-btn:hover{color:var(--text2)}
.m365-tog-btn.active{background:rgba(124,110,247,0.18);color:var(--accent)}
.light-bg .m365-tog-btn{color:rgba(80,80,100,0.6)}
.light-bg .m365-tog-btn.active{background:rgba(124,110,247,0.16);color:var(--accent)}
.m365-tog-btn.disabled{opacity:0.4;cursor:not-allowed}
.icon-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
/* Illustrations are drawn to be read at size, so four of them get the room
   twelve icons were sharing rather than being shrunk into the same cell. */
.icon-row.illus{grid-template-columns:repeat(2,1fr);gap:22px;max-width:520px;margin-inline:auto}
.set-toggle{margin-right:2px}
.row-label #set-reset{margin-left:2px}
.icon-cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default}
.icon-cell svg,.icon-cell .icon-img{width:64px;height:64px;display:block}
.icon-label{font-size:10px;color:rgba(128,128,140,0.7);text-align:center}
.light-bg .icon-label{color:rgba(80,80,100,0.6)}

/* ── ILLUSTRATIONS ── */
.illus-section{margin-top:4px}
.illus-preview-row{display:flex;gap:10px;margin-bottom:0}
.illus-cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.illus-cell svg{width:80px;height:80px;border-radius:8px}
.illus-label{font-size:10px;color:rgba(128,128,140,0.7);text-align:center}
.light-bg .illus-label{color:rgba(80,80,100,0.6)}
.illus-picker{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 0}
.illus-thumb{width:40px;height:40px;border-radius:6px;border:2px solid transparent;cursor:pointer;overflow:hidden;transition:all .12s;flex-shrink:0;background:#fff}
.illus-thumb svg{width:40px;height:40px;display:block}
.illus-thumb:hover{border-color:var(--accent-ring);transform:scale(1.08)}
.illus-thumb.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.illus-thumb.disabled{opacity:0.35;cursor:not-allowed;transform:none}
.illus-count{font-size:10px;color:var(--text3);margin-top:2px}

.controls{width:240px;border-left:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex-shrink:0}.ctrl-section{display:flex;flex-direction:column;gap:8px}
.ctrl-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.ctrl-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.ctrl-row label{min-width:64px;font-size:11px}
input[type=color]{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);cursor:pointer;padding:2px;background:var(--surface2);flex-shrink:0}
.hex-in{flex:1;font-size:11px;font-family:'Cascadia Code','Consolas',monospace;border:1px solid var(--border);border-radius:5px;padding:4px 7px;background:var(--surface2);color:var(--text);min-width:0}
.hex-in:focus{outline:none;border-color:var(--border2)}
.slider-row{display:flex;align-items:center;gap:7px}
.slider-row .slabel{font-size:11px;color:var(--text2);min-width:72px}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--border2);border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text);cursor:pointer}
.slider-row .sval{font-size:10px;color:var(--text3);min-width:30px;text-align:right;font-family:monospace}
.tog-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);cursor:pointer;user-select:none}
.tog{width:28px;height:16px;border-radius:8px;background:var(--surface2);border:1px solid var(--border2);position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--accent);border-color:var(--accent)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on::after{transform:translateX(12px)}
.divider{border:none;border-top:1px solid var(--border)}
.palette-dots{display:flex;gap:5px;margin-top:4px}
.pdot{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.12);transition:background .25s}
.pdot-label{font-size:9px;color:var(--text3);text-align:center;margin-top:2px}
.pdot-wrap{display:flex;flex-direction:column;align-items:center}
.no-ctrl{font-size:12px;color:var(--text3);line-height:1.6;padding:4px 0}
.ctrl-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .12s;width:100%;text-align:center}
.ctrl-btn:hover{background:var(--surface3);color:var(--text)}
.reset-btn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font);transition:all .12s;margin-left:auto}
.reset-btn:hover{border-color:var(--border2);color:var(--text2)}
.reset-btn svg{width:11px;height:11px;opacity:0.7}
.seed-derived{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;min-height:18px;margin-top:8px;font-size:11px;color:var(--text3);line-height:1.5}
.seed-derived div{flex:1;min-width:0}
.presets-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;margin-top:2px}
.preset-swatches{display:flex;gap:5px;flex-wrap:wrap}
.preset-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s;flex-shrink:0}
.preset-swatch:hover{transform:scale(1.15)}
.preset-swatch.active{border-color:var(--text);box-shadow:0 0 0 1px var(--accent-ring)}

/* ---- Expressive Assets library picker ---------------------------------- */
/* This input sits on the canvas, which has its own Dark/Light control separate
   from the page theme. Taking its background from the page tokens put a white
   field on a dark canvas, so it follows .light-bg like everything else here. */
.lib-search{flex:1;min-width:0;margin-left:12px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.92);
  font:inherit;font-size:12px;padding:5px 9px;border-radius:6px}
.lib-search::placeholder{color:rgba(255,255,255,.45)}
.light-bg .lib-search{background:rgba(16,16,20,.04);border-color:rgba(16,16,20,.14);color:#16181d}
.light-bg .lib-search::placeholder{color:rgba(16,16,20,.42)}
.lib-search:focus{outline:2px solid var(--accent,#4a9eff);outline-offset:1px}
.lib-results{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.lib-hit{background:var(--surface2,#2a2a2e);border:1px solid var(--line);color:inherit;
  font:inherit;font-size:11px;padding:4px 9px;border-radius:20px;cursor:pointer}
.lib-hit:hover{border-color:var(--accent,#4a9eff)}
.lib-hit .lib-col{opacity:.5;margin-left:6px}
.lib-note{color:rgba(255,255,255,.72);font-size:11px;margin-top:10px;line-height:1.5;max-width:60ch}
.light-bg .lib-note{color:rgba(30,30,40,.7)}

/* Customizer runs inside Gallery's shell and inherits every token from it, so
   the two tools read as one product. The old page carried its own dark-only
   palette; these aliases point its variable names at Gallery's, which is why
   the controls below theme themselves with the rest of the site. */
:root {
  --surface2: var(--surface-2);
  --surface3: var(--line-soft);
  --border: var(--line-soft);
  --border2: var(--line);
  --text2: var(--text-2);
  --text3: var(--text-3);
}

*, *::before, *::after { box-sizing: border-box; }

.nav { flex: none; }
.nav a.nav-item { text-decoration: none; }
.modes { padding: 4px 12px 20px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }

.ttl { display: flex; flex-direction: column; line-height: 1.25; }
.ttl strong { font-size: 15px; }
.ttl span { font-size: 12px; color: var(--text-3); }
.spacer { flex: 1; }
.toolbar .btn { padding: 8px 12px; font-size: 12.5px; }

/* The canvas: the set under the current style, big and close together, with no
   bounding box around each icon. The artwork is the thing being judged, so
   nothing is drawn around it. */
.preview-area { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.preview-grid-wrap { max-width: 780px; padding: 40px 32px; }
.icon-row { gap: 12px; margin-bottom: 26px; }
.icon-cell svg, .icon-cell .icon-img { width: 72px; height: 72px; }
.icon-label { font-size: 11px; }
.row-label { margin-bottom: 12px; }

.controls { width: 268px; background: var(--surface); }

/* A cell is clickable because clicking it is how you swap it. The selected one
   has to read at a glance from across a room in a review, so it gets a ring and
   its name goes accent. */
.icon-cell { cursor: pointer; border-radius: 10px; padding: 6px 2px; transition: background .12s; }
.icon-cell:hover { background: rgba(127, 127, 140, .10); }
.icon-cell.picking { background: rgba(127, 127, 140, .12); }
.icon-cell.picking svg, .icon-cell.picking .icon-img { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 8px; }
.icon-cell.picking .icon-label { color: var(--accent); font-weight: 600; }
#set-hint { text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="5" y="13.4" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="13.4" width="5.6" height="5.6" rx="1.6"/></svg>
      </div>
      <div class="brand-text">
        <strong>Expressive Assets</strong>
        <span>Windows Design Systems</span>
      </div>
    </div>

    <div class="modes">
      <div class="sidebar-label">Asset style</div>
      <button type="button" class="mode-card active" data-mode="default" onclick="setMode('default')" aria-pressed="true">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-default"></span>
      <span class="mode-text">
        <span class="mode-name">Default</span>
        <span class="mode-desc">Original full-color icons</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="flat" onclick="setMode('flat')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-flat"></span>
      <span class="mode-text">
        <span class="mode-name">Flat</span>
        <span class="mode-desc">4-role seed-generated palette</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="outline" onclick="setMode('outline')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-outline"></span>
      <span class="mode-text">
        <span class="mode-name">Outline</span>
        <span class="mode-desc">Stroke-only, minimal style</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="roles" onclick="setMode('roles')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-roles"></span>
      <span class="mode-text">
        <span class="mode-name">Roles</span>
        <span class="mode-desc">Themes the declared color groups instead of guessing</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="tinted" onclick="setMode('tinted')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-tinted"></span>
      <span class="mode-text">
        <span class="mode-name">Tinted</span>
        <span class="mode-desc">Monochromatic from a seed color</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="soft" onclick="setMode('soft')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-soft"></span>
      <span class="mode-text">
        <span class="mode-name">Soft</span>
        <span class="mode-desc">Pastel illustration palette with airy gradients</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="dichromic" onclick="setMode('dichromic')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-dichromic"></span>
      <span class="mode-text">
        <span class="mode-name">Chroma</span>
        <span class="mode-desc">Atmospheric duotone with light &amp; bloom</span>
      </span>
    </button>
    <button type="button" class="mode-card" data-mode="acrylic" onclick="setMode('acrylic')" aria-pressed="false">
      <span class="mode-check"></span>
      <span class="mode-thumb" id="thumb-acrylic"></span>
      <span class="mode-text">
        <span class="mode-name">Acrylic</span>
        <span class="mode-desc">Frosted glass — layered plates with depth</span>
      </span>
    </button>
    </div>

    <div class="sidebar-foot">
      <p class="version">Customizer 2.0 <span aria-hidden="true">&middot;</span> <a href="customizer-v1.html" title="The previous Customizer, kept exactly as it was">1.0 archive</a></p>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="ttl">
        <strong>Customizer</strong>
        <span id="canvas-count">Canvas &middot; 12 assets</span>
      </div>
      <div class="spacer"></div>
      <span data-theme-switch></span>
      <span data-app-menu></span>
    </header>

    <div class="content">
      <div class="preview-area">
        <div class="preview-pane dark-bg" id="preview-pane">
          <div class="preview-grid-wrap">
            <div class="row-label">
              <span class="preview-bg-toggle set-toggle" role="group" aria-label="What is on the canvas">
                <button class="bg-btn active" id="set-icons" onclick="setSetKind('icons')">Icons</button>
                <button class="bg-btn" id="set-illustrations" onclick="setSetKind('illustrations')">Illustrations</button>
                <button class="bg-btn" id="set-custom" onclick="setSetKind('custom')">Custom</button>
              </span>
              <button class="export-btn" id="set-reset" onclick="setReset()" title="Put this canvas back to its starting assets">Reset</button>
              <span class="m365-toggle-label" id="set-hint">Click a name to swap it</span>
              <span class="canvas-tools">
                <span class="preview-bg-toggle" role="group" aria-label="Canvas background">
                  <button class="bg-btn active" id="bg-dark" onclick="setBg('dark')">Dark</button>
                  <button class="bg-btn" id="bg-light" onclick="setBg('light')">Light</button>
                </span>
                <button class="export-btn" onclick="exportAllSvgs()" title="Download every icon on the canvas as SVG">Export all</button>
              </span>
            </div>
            <div class="icon-row" id="row-set"></div>

// Which 3 are currently shown (indices into ILLUSTRATIONS)
let illusSelected = [0, 1, 2];

function renderIllusPicker() {
  const picker = document.getElementById('illus-picker');
  const count = document.getElementById('illus-count');
  if (!picker) return;
  picker.innerHTML = '';
  ILLUSTRATIONS.forEach((illus, i) => {
    const thumb = document.createElement('div');
    const isSelected = illusSelected.includes(i);
    thumb.className = 'illus-thumb' + (isSelected ? ' selected' : '');
    const w = document.createElement('div');
    w.innerHTML = illus.svg;
    const s = w.querySelector('svg');
    if (s) { s.setAttribute('width','40'); s.setAttribute('height','40'); }
    if (s) thumb.appendChild(s);
    thumb.title = illus.name;
    thumb.onclick = () => {
      if (isSelected) {
        // Deselect only if more than 1 selected
        if (illusSelected.length > 1) {
          illusSelected = illusSelected.filter(x => x !== i);
          renderIllusPicker();
          renderIllusPreview();
        }
      } else {
        if (illusSelected.length < 3) {
          illusSelected = [...illusSelected, i];
        } else {
          // Replace the oldest selection
          illusSelected = [...illusSelected.slice(1), i];
        }
        renderIllusPicker();
        renderIllusPreview();
      }
    };
    picker.appendChild(thumb);
  });
  if (count) count.textContent = `${illusSelected.length} of ${ILLUSTRATIONS.length} shown`;
}

function renderIllusPreview() {
  const row = document.getElementById('illus-preview');
  if (!row) return;
  row.innerHTML = '';
  illusSelected.forEach(i => {
    const illus = ILLUSTRATIONS[i];
    const cell = document.createElement('div');
    cell.className = 'illus-cell';
    const w = document.createElement('div');
    w.innerHTML = illus.svg;
    const s = w.querySelector('svg');
    if (s) { s.setAttribute('width','80'); s.setAttribute('height','80'); cell.appendChild(s); }
    const lbl = document.createElement('div');
    lbl.className = 'illus-label';
    lbl.textContent = illus.name;
    cell.appendChild(lbl);
    row.appendChild(cell);
  });
}
const SYSTEM_PRESETS = [
  { name: 'Azure',  hex: '#0078D4' },

function renderPresets(stateKey, colorInputId, hexInputId) {
  const wrap = document.createElement('div');

  const label = document.createElement('div');
  label.className = 'presets-label';
  label.textContent = 'Presets';
  const row = document.createElement('div');
  row.className = 'preset-swatches';
  row.id = 'preset-row-' + stateKey;

  SYSTEM_PRESETS.forEach(p => {
    const btn = document.createElement('div');
    const isActive = p.hex.toLowerCase() === state[stateKey].toLowerCase();
    btn.className = 'preset-swatch' + (isActive ? ' active' : '');
    btn.style.background = p.hex;
    btn.title = p.name;
    btn.onclick = () => {
      state[stateKey] = p.hex;
      const c = document.getElementById(colorInputId);
      const h = document.getElementById(hexInputId);
      if (c) c.value = p.hex;
      if (h) h.value = p.hex;
      row.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      onSeedUpdate();
    };
    row.appendChild(btn);
  });

  wrap.appendChild(label);
  wrap.appendChild(row);
  return wrap;
}

// Called whenever a seed color input changes manually — deselects presets if no match
function syncPresetActive(stateKey) {
  const row = document.getElementById('preset-row-' + stateKey);
  if (!row) return;
  const current = (state[stateKey] || '').toLowerCase();
  row.querySelectorAll('.preset-swatch').forEach(btn => {
    const matches = btn.style.background && hexFromRgbOrHex(btn.style.background).toLowerCase() === current;
    btn.classList.toggle('active', matches);
  });
}

// Normalize any color string to hex for comparison
function hexFromRgbOrHex(str) {

  const m = str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (m) return '#' + [m[1],m[2],m[3]].map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
  return str;
}
