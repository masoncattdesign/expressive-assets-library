        if(locked[i]) return; // glyphs/badges stay solid
        const fill = el.getAttribute('fill') || '';
        if(fill.startsWith('url')) return; // already gradient, skip
        // Normalize hsl() / hex; halftone pattern accepts any color string.
        if(!fill) return;
        if(!patternByTone.has(fill)) {
          const pid = 'flat_ht_' + patternByTone.size + '_' + Math.random().toString(36).slice(2,6);
          patternByTone.set(fill, pid);
          const patFrag = doc.createRange().createContextualFragment(
            buildHalftonePattern(pid, fill, vw, vh, 50, 15)
          );
          defs.appendChild(patFrag);
        }
        el.setAttribute('fill', `url(#${patternByTone.get(fill)})`);
      });
    }

    if(!svg.getAttribute('xmlns'))svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return svgStr;}
}

// ── Acrylic / Frosted-glass treatment ────────────────────────────────────
// The acrylic effect duplicates the icon's silhouette into two stacked
// copies, mimicking the look of a frosted glass card sitting over a
// saturated colored card:
//
//   BACK COPY  — offset up-left, recolored to a single saturated seed,
//                slightly blurred for depth
//   FRONT COPY — offset down-right, recolored to a low-opacity translucent
//                white "frost" with a thin white edge highlight
//   GLYPH      — the icon's interior detail (small shapes) rendered sharp
//                on top of the front copy in a darker seed tone
//
// Unlike Flat which assigns 4 tones, Acrylic uses three semantic roles:
//   • body — the dominant shape that becomes both plates
//   • glyph — small interior detail (letters, symbols) that stays sharp
//   • everything else is part of the body silhouette
//
// We classify shapes by area: the largest shape (or two) is the "body";
// shapes below 12% of viewBox area are "glyph" detail.
function applyAcrylic(svgStr, seedHex, bgMode='dark', offsetPct=8, frost=32, secHueOffset=0) {
  try {
    const parser=new DOMParser();
    const doc=parser.parseFromString(svgStr,'image/svg+xml');
    const svg=doc.querySelector('svg');
    if(!svg) return svgStr;
    let vx=0,vy=0,vw=80,vh=80;
    const vb=svg.getAttribute('viewBox');
    if(vb){const p=vb.trim().split(/[\s,]+/).map(Number);if(p.length===4){[vx,vy,vw,vh]=p;}}

    // === Color palette ===
    const [h,s] = hexToHsl(seedHex);
    const sat = clamp(s*1.3, 30, 95);
    // Back plate: saturated seed. Glass-look benefits from a punchy back.
    const backColor = hslToHex(h, sat, bgMode==='dark' ? 56 : 50);
    // Back inner shadow tint — slightly darker for body depth.
    const backShade = hslToHex(h, sat, bgMode==='dark' ? 44 : 38);
    // Frosted front plate fill — white-ish with low alpha lets back show through.
    const frostAlpha = clamp(frost/100, 0.15, 0.55);
    // Glyph color: darker seed (or hue-shifted seed if secHueOffset != 0).
    const glyphH = ((h + secHueOffset)%360 + 360) % 360;
    const glyphColor = hslToHex(glyphH, clamp(sat*0.9, 30, 90), bgMode==='dark' ? 28 : 22);
    // Edge highlight (very thin bright stroke on front plate)
    const edgeColor = '#FFFFFF';

    // === Strip mask/filter/clip/gradient — flatten the source ===
    Array.from(doc.querySelectorAll('filter,mask,clipPath,pattern')).forEach(n=>n.remove());
    Array.from(doc.querySelectorAll('*')).forEach(el=>{
      ['filter','mask','clip-path','opacity','fill-opacity','stroke-opacity'].forEach(a=>el.removeAttribute(a));
      const sty=el.getAttribute('style');if(sty)el.removeAttribute('style');
    });
    // Strip any large white rect that's just a clip-bg.
    Array.from(svg.querySelectorAll('rect')).forEach(el=>{
      const w=parseFloat(el.getAttribute('width')||'0'),h=parseFloat(el.getAttribute('height')||'0');
      const f=(el.getAttribute('fill')||'').toLowerCase();
      if((f==='white'||f==='#ffffff')&&w>=vw*0.85&&h>=vh*0.85) el.remove();
    });

    // === Collect drawable shapes ===
    const allShapes=Array.from(svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline')).filter(el=>{
      let node=el.parentElement;
      while(node&&node!==svg){if(node.tagName==='defs')return false;node=node.parentElement;}
      return true;
    });
    if(!allShapes.length) return svgStr;

    // === Compute shape areas (rough bbox approximations) ===
    const shapeArea = el => {
      try {
        const tag=el.tagName.toLowerCase();
        if(tag==='rect'){
          const w=parseFloat(el.getAttribute('width')||'0');
          const h=parseFloat(el.getAttribute('height')||'0');
          return w*h;
        }
        if(tag==='circle'){
          const r=parseFloat(el.getAttribute('r')||'0');
          return Math.PI*r*r;
        }
        if(tag==='ellipse'){
          const rx=parseFloat(el.getAttribute('rx')||'0');
          const ry=parseFloat(el.getAttribute('ry')||'0');
          return Math.PI*rx*ry;
        }
        const d=el.getAttribute('d')||'';
        const nums=d.match(/-?\d+(\.\d+)?/g);
        if(!nums||nums.length<4) return 0;
        const xs=[],ys=[];
        for(let i=0;i+1<nums.length;i+=2){xs.push(parseFloat(nums[i]));ys.push(parseFloat(nums[i+1]));}
        const w=Math.max(...xs)-Math.min(...xs);
        const h=Math.max(...ys)-Math.min(...ys);
        return Math.abs(w*h);
      }catch(e){return 0;}
    };

    const totalArea = vw * vh;
    // Tag each shape with its area + index (preserve render order).
    const shapeInfo = allShapes.map((el,i)=>({el,i,area:shapeArea(el),pct:shapeArea(el)/totalArea}));

    // === Classify: body shapes (>25% area) vs glyph shapes (the rest) ===
    // Body = the icon's silhouette/plate. Glyph = letters, symbols, small details.
    const bodyShapes = shapeInfo.filter(s => s.pct >= 0.25).map(s => s.el);
    const glyphShapes = shapeInfo.filter(s => s.pct < 0.25).map(s => s.el);

    // If no body shape found (edge case: icon is all small details, like Alarms
    // which has thin clock hands), fall back to using the largest shape as body.
    if(!bodyShapes.length && shapeInfo.length) {
      const largest = shapeInfo.slice().sort((a,b)=>b.area-a.area)[0];
      bodyShapes.push(largest.el);
      const idx = glyphShapes.indexOf(largest.el);
      if(idx>-1) glyphShapes.splice(idx,1);
    }

    // === Strip lingering gradients (we re-fill everything) ===
    Array.from(doc.querySelectorAll('linearGradient,radialGradient')).forEach(n=>n.remove());

    // === Build serialized shape strings for body & glyph ===
    // Make copies of body shapes — we'll render them twice (back + front).
    // For the BACK copy, recolor everything in the body to the saturated seed.
    // For the FRONT copy, we use a translucent white frost overlay.
    const serializeBodyWithFill = (fill, opacity=1) => {
      return bodyShapes.map(el => {
        const clone = el.cloneNode(true);
        clone.setAttribute('fill', fill);
        if(opacity < 1) clone.setAttribute('fill-opacity', opacity);
        clone.setAttribute('stroke', 'none');
        // For the FRONT copy edge stroke, we'll add stroke separately
        return new XMLSerializer().serializeToString(clone);
      }).join('');
    };
    const serializeBodyAsStroke = (color, width, opacity) => {
      return bodyShapes.map(el => {
        const clone = el.cloneNode(true);
        clone.setAttribute('fill', 'none');
        clone.setAttribute('stroke', color);
        clone.setAttribute('stroke-width', width);
        clone.setAttribute('stroke-opacity', opacity);
        return new XMLSerializer().serializeToString(clone);
      }).join('');
    };
    // Glyph: recolor all to glyphColor, keep sharp.
    const serializeGlyph = () => {
      return glyphShapes.map(el => {
        const clone = el.cloneNode(true);
        clone.setAttribute('fill', glyphColor);
        clone.setAttribute('stroke', 'none');
        return new XMLSerializer().serializeToString(clone);
      }).join('');
    };

    // === Compose transforms ===
    // BACK copy stays in place at full size — it's the icon's base position.
    // FRONT copy shifts slightly down-right to suggest a frosted plate
    // floating just above the base. No scale changes — both copies are
    // identical-sized silhouettes, only translated.
    const dx = vw * (offsetPct/100);
    const dy = vh * (offsetPct/100);
    const backTx = ``; // identity — base stays where it is
    const frontTx = `translate(${dx} ${dy})`;

    // === Build the filters ===
    const uid='acr'+Math.random().toString(36).slice(2,8);
    // Soft blur on the back copy for depth (subtle, not heavy).
    const backBlur = `<filter id="${uid}_backblur" x="-10%" y="-10%" width="120%" height="120%">`
      +`<feGaussianBlur stdDeviation="${Math.min(vw,vh)*0.005}"/>`
      +`</filter>`;
    // Drop shadow on the front copy for lift off the back.
    const dropShadow = `<filter id="${uid}_drop" x="-15%" y="-15%" width="130%" height="130%">`
      +`<feGaussianBlur in="SourceAlpha" stdDeviation="${Math.min(vw,vh)*0.012}"/>`
      +`<feOffset dx="0" dy="${Math.min(vw,vh)*0.008}"/>`
      +`<feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>`
      +`<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>`
      +`</filter>`;

    const edgeStrokeW = Math.min(vw,vh) * 0.008;

    // === Assemble final SVG ===
    // Layer order (back to front):
    //   1. Back copy — saturated seed silhouette, slightly blurred
    //   2. Front copy frosted body — white at low alpha (the glass)
    //   3. Front copy edge stroke — thin white edge highlight (glass rim)
    //   4. Glyph — sharp detail in glyph color, in front-copy coords
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${vw} ${vh}" width="80" height="80">`
      +`<defs>${backBlur}${dropShadow}</defs>`
      // Frosted body — translucent white silhouette with thin white edge highlight
      +`<g transform="${frontTx}" filter="url(#${uid}_drop)">`
        +serializeBodyWithFill(edgeColor, frostAlpha)
        +serializeBodyAsStroke(edgeColor, edgeStrokeW, 0.55)
      +`</g>`
      // Glyph: sharp interior detail on top of frosted body
      +`<g transform="${frontTx}">`
        +serializeGlyph()
      +`</g>`
    +`</svg>`;
  } catch(e) {
    console.warn('applyAcrylic failed:', e);
    return svgStr;
  }
}

function transformSvg(svgStr,iconName,forceOriginal,asset){
  if(state.mode==='default')return svgStr;
  if(state.mode==='roles'){
    return applyRoles(svgStr,asset,{
      seed:state.rolesSeed, target:state.rolesTarget, accents:state.rolesAccents,
      spread:state.rolesSpread, hueMode:state.rolesHue, chroma:state.rolesChroma,
      light:state.rolesLight, flatten:state.rolesFlatten, themeBase:state.rolesBase,
    });
  }

  // Copilot is rainbow by design — in any Original sub-mode, single-hue
  // treatment loses its multi-color identity. For Tinted we pass through
  // unchanged (the tint pipeline doesn't have a clean per-shape variant).
  // For Outline and Flat we apply per-shape treatment (each shape uses its
  // own dominant hue), which produces the multi-color outline / multi-color
  // 2-tone flat look while still adopting the mode's treatment style.
  const isCopilot=iconName==='Copilot';
  const inOriginalSubmode=
    (state.mode==='tinted'&&(state.tintMode==='original'||forceOriginal))||
    (state.mode==='outline'&&(state.outlineMode==='original'||forceOriginal))||
    (state.mode==='flat'&&(state.flatMode==='original'||forceOriginal));
  if(isCopilot&&inOriginalSubmode&&state.mode==='tinted')return svgStr;
  if(state.mode==='tinted'){
    const useOriginal=forceOriginal||state.tintMode==='original';
    const seedHex=useOriginal?getDominantHue(svgStr):state.tintSeed;
    const effectiveMode=useOriginal?'mono':state.tintMode;
    // secHue only matters in duo mode (mono/original don't use an accent hue).
    const secH=effectiveMode==='duo'?state.tintSecHue:0;
    return applyTinted(svgStr,seedHex,state.tintOpacity,state.tintBrightness,state.tintContrast,state.tintSaturation,effectiveMode,secH);
  }
  if(state.mode==='dichromic'){
    if(forceOriginal)return svgStr; // Chroma has no Original sub-mode
    const{shadow,highlight,lightColor}=deriveDichColors(state.dichSeed,state.dichSecHue);
    return applyDichromic(svgStr,shadow,highlight,lightColor,state.dichAngle,state.dichIntensity,state.dichSpread,state.dichShimmer,state.dichEdge,state.dichLight,state.dichBloomDist);
  }
  if(state.mode==='outline'){
    const useOriginal=forceOriginal||state.outlineMode==='original';
    const duo=!useOriginal&&state.outlineMode==='duo';
    const seedHex=useOriginal?getDominantHue(svgStr):state.outlineSeed;
    const perShape=isCopilot&&useOriginal;
    const secH=duo?state.outlineSecHue:0;
    return applyOutline(svgStr,seedHex,state.outlineWeight,state.bgMode,duo,perShape,secH,state.outlineGradients,state.outlineTexture,state.outlineGradIntensity);
  }
  if(state.mode==='flat'){
    const useOriginal=forceOriginal||state.flatMode==='original';
    const duo=!useOriginal&&state.flatMode==='duo';
    const seedHex=useOriginal?getDominantHue(svgStr):state.flatSeed;
    const secH=duo?state.flatSecHue:0;
    const pal=generateFlatPalette(seedHex,state.flatSaturation/100,duo,state.bgMode,secH);
    const perShape=isCopilot&&useOriginal;
    return applyFlat(svgStr,pal,state.flatGradients,perShape,duo,state.flatTexture,state.flatGradIntensity);
  }
  if(state.mode==='acrylic'){
    // Acrylic doesn't have an Original sub-mode since the whole point is the
    // dual-plate composition — Original would just be the source icon.
    // forceOriginal (from M365 toggle) is honored by passing the source through.
    if(forceOriginal) return svgStr;
    return applyAcrylic(svgStr,state.acrylicSeed,state.bgMode,state.acrylicOffset,state.acrylicFrost,state.acrylicSecHue);
  }
  if(state.mode==='soft'){
    // Soft mode honors M365 forceOriginal by passing the source through
    // unchanged — same convention as Tinted/Flat.
    if(forceOriginal) return svgStr;
    if(state.softGroupBy!=='luminance')
      return applySoftRoles(svgStr,asset,state.softSeed,state.softIntensity,state.softSecHue,state.softBase,state.softGroupBy);
    return applySoft(svgStr, state.softSeed, state.softIntensity, state.softSecHue);
  }
  return svgStr;
}

/* SVG ids are document-global, and this page puts the same artwork on the
   canvas and inside seven mode-card thumbnails at once. Word's paint0 gradient
   ends up defined six times under one id, the browser resolves url(#id) to the
   FIRST match, and every copy paints itself with whichever one happened to be
   inserted first -- normally a thumbnail, holding the untouched original.

   The effect is invisible in modes that build fresh gradients under a random
   uid, and glaring in Roles, which edits the stops of the gradients already
   there: the canvas icon was recolored correctly and then drawn with the
   thumbnail's colors.

   So every instance gets its own namespace at insertion time. Applied after
   the transform, never before, so a pipeline still sees the ids it expects.
   Exported SVGs keep the original ids, since they leave as whole documents. */
let _nsSeq = 0;
function nsIds(svgStr) {
  const ids = [...new Set([...svgStr.matchAll(/\sid="([^"]+)"/g)].map((m) => m[1]))];
  if (!ids.length) return svgStr;
  const tag = 'i' + (++_nsSeq).toString(36) + '-';
  let out = svgStr;
  for (const id of ids) {
    const esc = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out
      .replace(new RegExp('id="' + esc + '"', 'g'), 'id="' + tag + id + '"')
      .replace(new RegExp('url\\(#' + esc + '\\)', 'g'), 'url(#' + tag + id + ')')
      .replace(new RegExp('(xlink:)?href="#' + esc + '"', 'g'), '$1href="#' + tag + id + '"');
  }
  return out;
}

async function renderIconCell(name,svgStr,forceOriginal,asset,size){
  const cell=document.createElement('div');cell.className='icon-cell';
  const transformed=transformSvg(svgStr,name,forceOriginal,asset);
  cell.innerHTML=nsIds(transformed)+`<div class="icon-label">${name}</div>`;
  const px=String(size||64);
  const svg=cell.querySelector('svg');if(svg){svg.setAttribute('width',px);svg.setAttribute('height',px);}
  // Right-click → download this icon's current SVG. Source preserved on the
  // cell so the export pipeline re-runs transformSvg from the unmodified input.
  cell._origSvg=svgStr;
  cell._iconName=name;
  cell._asset=asset||null;
  cell.title='Right-click to download SVG';
  cell.addEventListener('contextmenu',(e)=>{
    e.preventDefault();
    exportSingleSvg(name,svgStr,asset);
  });
  return cell;
}

let _renderToken=0;
async function renderIcons(){
  const token=++_renderToken;
  const m365Row=document.getElementById('row-m365');
  const winRow=document.getElementById('row-win');
  m365Row.innerHTML='';winRow.innerHTML='';
  const m365Entries=Object.entries(SVG_M365_ORDERED);
  const winEntries=Object.entries(SVG_WIN_ORDERED);
  const m365Force=state.m365Recolor==='off';
  const[m365Cells,winCells]=await Promise.all([
    Promise.all(m365Entries.map(([n,s])=>renderIconCell(n,s,m365Force))),
    Promise.all(winEntries.map(([n,s])=>renderIconCell(n,s,false)))
  ]);
  if(token!==_renderToken)return;
  m365Cells.forEach(c=>m365Row.appendChild(c));
  winCells.forEach(c=>winRow.appendChild(c));
}

/* Thumbnails preview the pipeline, so they have to be drawn from the same
   artwork the canvas is showing. They used to be two icons hardcoded into this
   file from a set the library no longer has, which meant the card could
   promise something the canvas would never produce. Three assets off the
   current set, and a fall back to the built-in samples only when the library
   has not loaded, which is the file:// case. */
async function renderThumbs(){
  const fromSet=(Array.isArray(SET)?SET:[]).filter(a=>a&&a.svg).slice(0,3).map(a=>a.svg);
  const samples=fromSet.length?fromSet:[SVG_WIN_V2['Photos'],SVG_WIN_V2['Notepad']].filter(Boolean);
  const sample=samples[0];
  const sample2=samples[1]||samples[0];
  const makeSvgThumb=(svgStr,size=28)=>{const w=document.createElement('div');w.innerHTML=nsIds(svgStr);const s=w.querySelector('svg');if(s){s.setAttribute('width',size);s.setAttribute('height',size);}return s;};
  const dtThumb=document.getElementById('thumb-default');if(dtThumb){dtThumb.innerHTML='';samples.forEach(s=>{const el=makeSvgThumb(s);if(el)dtThumb.appendChild(el);});}
  const tintedThumb=document.getElementById('thumb-tinted');if(tintedThumb){tintedThumb.innerHTML='';samples.forEach(s=>{const t=applyTinted(s,'#0078D4',85,100,110,90,'duo');const el=makeSvgThumb(t);if(el)tintedThumb.appendChild(el);});}
  const dichThumb=document.getElementById('thumb-dichromic');if(dichThumb){dichThumb.innerHTML='';const{shadow,highlight,lightColor}=deriveDichColors('#0078D4',0);samples.forEach(s=>{const t=applyDichromic(s,shadow,highlight,lightColor,315,85,70,true,true,true,90);const el=makeSvgThumb(t);if(el)dichThumb.appendChild(el);});}
  const outlineThumb=document.getElementById('thumb-outline');if(outlineThumb){outlineThumb.innerHTML='';samples.forEach(s=>{const t=applyOutline(s,'#0078D4',50,'dark',true);const el=makeSvgThumb(t);if(el)outlineThumb.appendChild(el);});}
  const flatThumb=document.getElementById('thumb-flat');if(flatThumb){flatThumb.innerHTML='';const pal=generateFlatPalette('#0078D4',1.3,true);samples.forEach(s=>{const t=applyFlat(s,pal,false);const el=makeSvgThumb(t);if(el)flatThumb.appendChild(el);});}
  const acrylicThumb=document.getElementById('thumb-acrylic');if(acrylicThumb){acrylicThumb.innerHTML='';samples.forEach(s=>{const t=applyAcrylic(s,'#0078D4','dark',8,32,0);const el=makeSvgThumb(t);if(el)acrylicThumb.appendChild(el);});}
  const rolesThumb=document.getElementById('thumb-roles');
  if(rolesThumb){
    rolesThumb.innerHTML='';
    // The thumb draws from whatever is on the canvas, so it shows the real
    // pipeline when the set carries roles and the untouched artwork when not.
    const withRoles=(Array.isArray(SET)?SET:[]).filter(a=>a&&a.roles);
    const src=withRoles.length?withRoles.slice(0,3):[];
    (src.length?src:samples.map(sv=>({svg:sv,roles:null}))).forEach(a=>{
      const t=a.roles?applyRoles(a.svg,a,{seed:'#0078D4',target:'relative',accents:2,spread:46,
        hueMode:'replace',chroma:100,light:0,flatten:false,themeBase:false}):a.svg;
      const el=makeSvgThumb(t);if(el)rolesThumb.appendChild(el);
    });
  }
  const softThumb=document.getElementById('thumb-soft');if(softThumb){softThumb.innerHTML='';samples.forEach(s=>{const t=applySoft(s,'#5B7AE8',50,0);const el=makeSvgThumb(t);if(el)softThumb.appendChild(el);});}
}

// ── EXPORT ───────────────────────────────────────────────────────────────
// Map state to a config object describing the current "look" — used to build
// filenames so a downloaded SVG carries the settings it was rendered with.
function currentExportConfig(){
  const cfg={mode:state.mode,bg:state.bgMode};
  if(state.mode==='tinted'){cfg.seed=state.tintMode==='original'?null:state.tintSeed;cfg.modeOption=state.tintMode;}
  else if(state.mode==='dichromic'){cfg.seed=state.dichSeed;}
  else if(state.mode==='outline'){cfg.seed=state.outlineMode==='original'?null:state.outlineSeed;cfg.modeOption=state.outlineMode;}
  else if(state.mode==='flat'){cfg.seed=state.flatMode==='original'?null:state.flatSeed;cfg.modeOption=state.flatMode;}
  else if(state.mode==='acrylic'){cfg.seed=state.acrylicSeed;}
  else if(state.mode==='soft'){cfg.seed=state.softSeed;cfg.modeOption=state.softGroupBy;}
  else if(state.mode==='roles'){cfg.seed=state.rolesSeed;cfg.modeOption=state.rolesTarget+state.rolesAccents;}

  return cfg;
}
// Match a hex to a preset name. Case-insensitive. Returns hex sans '#' if no match.
function seedLabel(hex){
  if(!hex)return null;
  const lc=hex.toLowerCase();
  const hit=SYSTEM_PRESETS.find(p=>p.hex.toLowerCase()===lc);
  return hit?hit.name.toLowerCase():lc.replace('#','');
}
// Build a filename: App_mode_modeOption_seed_bg.svg, skipping null/undef parts.
function buildExportFilename(iconName,cfg){
  const slug=s=>s.replace(/[^a-z0-9]+/gi,'').toLowerCase();
  const parts=[slug(iconName),cfg.mode];
  if(cfg.modeOption)parts.push(cfg.modeOption);
  // Append seed slot only when there's a concrete seed to label. "Original"
  // modes already say so in modeOption, and Default has no seed at all.
  if(cfg.seed)parts.push(seedLabel(cfg.seed));
  parts.push(cfg.bg);
  return parts.join('_')+'.svg';
}
// Strip the 64x64 width/height that renderIconCell adds, so exported SVGs use
// their native viewBox and scale crisply at any size.
function svgForExport(svgStr){
  return svgStr.replace(/<svg([^>]*?)\s+width="64"/,'<svg$1').replace(/\s+height="64"/,'');
}
// Trigger a browser download of a single string as a file.
function downloadFile(filename,content,mime='image/svg+xml'){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},0);
}
// Re-run the transform pipeline for one icon and return its current SVG markup.
async function exportSingleSvg(iconName,svgSrc,asset){
  const isM365=iconName in SVG_M365_ORDERED;
  const force=isM365&&state.m365Recolor==='off';
  const transformed=transformSvg(svgSrc,iconName,force,asset);
  const cfg=currentExportConfig();
  const filename=buildExportFilename(iconName,cfg);
  downloadFile(filename,svgForExport(transformed));
}
// Export every icon (M365 + Windows) as a single ZIP. Uses JSZip from CDN.
async function exportAllSvgs(){
  if(typeof JSZip==='undefined'){
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload=resolve;s.onerror=reject;
      document.head.appendChild(s);
    });
  }
  const zip=new JSZip();
  const cfg=currentExportConfig();
  const m365Entries=Object.entries(SVG_M365_ORDERED);
  const winEntries=Object.entries(SVG_WIN_ORDERED);
  // M365 honors the M365 toggle — when set to Original, force per-icon Original
  // treatment of whatever the active mode is.
  const m365Force=state.m365Recolor==='off';
  m365Entries.forEach(([name,svg])=>{
    zip.file(buildExportFilename(name,cfg),svgForExport(transformSvg(svg,name,m365Force)));
  });
  winEntries.forEach(([name,svg])=>{
    zip.file(buildExportFilename(name,cfg),svgForExport(transformSvg(svg,name,false)));
  });
  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const parts=[cfg.mode];
  if(cfg.modeOption)parts.push(cfg.modeOption);
  if(cfg.seed)parts.push(seedLabel(cfg.seed));
  parts.push(cfg.bg);
  a.href=url;a.download=`icons_${parts.join('_')}.zip`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},0);
}

/* ======================================================================
   Expressive Assets library
   ----------------------------------------------------------------------
   The pipeline takes an SVG STRING and knows nothing about where it
   came from, so pulling from the library is a data-loading problem rather
   than a pipeline change. Nothing below this section had to move.

   Two constraints shaped this:

   1. The tool still has to open with a double-click. fetch() is blocked on
      file://, so a failed load is a normal state, not an error — the built-in
      sample icons stay and the library row simply never appears.

   2. Only the STANDARD theme is offered. Outline and Filled are drawn in
      currentColor, and this pipeline works by reading source colors and
      re-filling by luminance; there is nothing there to read. Those variants
      already recolor in Gallery through the accent picker, which is the
      right tool for them.
   ====================================================================== */

const LIB = { assets: [], byId: new Map(), available: false, chosen: [] };

/* Imported artwork carries its tint hooks inline as `var(--ea-role, #hex)`.
   Every color reader here handles #hex and rgb() only, so the fallback is
   resolved on the way in. Without this the M365 illustrations — the one set
   authored to be recolored — would be the set that fails. */
function resolveColorVars(svgStr){
  return svgStr.replace(/var\(\s*--[a-z0-9-]+\s*,\s*(#[0-9a-f]{3,8})\s*\)/gi, '$1');
}

async function loadLibrary(){
  try{
    const res = await fetch('manifest.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const manifest = await res.json();
    LIB.assets = (manifest.assets || []).filter(a => a.variants && a.variants.standard);
    LIB.assets.forEach(a => LIB.byId.set(a.id, a));
    LIB.available = LIB.assets.length > 0;
  }catch(err){
    // file:// or the manifest is not beside this page. Samples still work.
    LIB.available = false;
  }
  const label = document.getElementById('lib-label');
  const note  = document.getElementById('lib-note');
  if(LIB.available){
    label.style.display = '';
    const search = document.getElementById('lib-search');
    search.placeholder = `Search ${LIB.assets.length.toLocaleString()} assets…`;
    search.addEventListener('input', () => libSearch(search.value));
    note.hidden = false;
    note.hidden = true;
  }else{
    note.hidden = false;
    note.textContent = 'Library not loaded. Open this page from the published site (or any local server) to pull assets from Expressive Assets; opened straight from disk, browsers block the fetch and only the sample icons above are available.';
  }
  await libApplyDeepLink();
}

/** Rank by how early the match lands, so exact ids and name-starts win. */
function libSearch(query){
  const box = document.getElementById('lib-results');
  const q = query.trim().toLowerCase();
  if(q.length < 2){ box.hidden = true; box.innerHTML = ''; return; }
  const hits = [];
  for(const a of LIB.assets){
    const hay = [a.id, a.name, ...(a.keywords||[]), ...(a.aliases||[])].join(' ').toLowerCase();
    const at = hay.indexOf(q);
    if(at >= 0) hits.push([at, a]);
    if(hits.length > 400) break;
  }
  hits.sort((x,y) => x[0]-y[0] || x[1].name.localeCompare(y[1].name));
  box.hidden = false;
  box.innerHTML = hits.slice(0,24).map(([,a]) =>
    `<button class="lib-hit" onclick="libAdd('${a.id}')">${a.name}<span class="lib-col">${a.collection}</span></button>`
  ).join('') || '<span class="lib-note">No match.</span>';
}

async function libAdd(id){
  const asset = LIB.byId.get(id);
  if(!asset) return;
  const sizes = Object.keys(asset.variants.standard);
  // Prefer the largest drawing: these pipelines bucket by luminance and read
  // better with more shapes to work from. 'any' means one scalable drawing.
  const pick = sizes.includes('any') ? 'any'
    : String(Math.max(...sizes.map(Number).filter(Number.isFinite)));
  const path = asset.variants.standard[pick];
  try{
    const res = await fetch(path, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const svg = resolveColorVars(await res.text());
    if(!LIB.chosen.some(c => c.id === id)) LIB.chosen.push({ id, name: asset.name, svg });
    await renderLibraryRow();
  }catch(err){
    const note = document.getElementById('lib-note');
    note.hidden = false;
    note.textContent = `Could not load ${asset.name} (${path}): ${err.message}`;
  }
}

function libClear(){ LIB.chosen = []; renderLibraryRow(); }

async function renderLibraryRow(){
  const row = document.getElementById('row-library');
  if(!row) return;
  row.innerHTML = '';
  const cells = await Promise.all(LIB.chosen.map(c => renderIconCell(c.name, c.svg, false)));
  cells.forEach(c => row.appendChild(c));
}

/* Gallery links here as customizer.html?asset=<id>[&asset=<id>…]. Deep-linking by
   id rather than by file path means the link survives a re-import that changes
   which sizes exist. */
async function libApplyDeepLink(){
  const ids = new URLSearchParams(location.search).getAll('asset');
  for(const id of ids) await libAdd(id);
}

/* ======================================================================
   Canvas 1.1
   ----------------------------------------------------------------------
   The canvas used to be two fixed rows of built-in artwork: Microsoft 365
   above, Windows apps below, with a toggle for whether the M365 row took the
   recolor. That split was about where the sample art came from, which is not
   a distinction anyone tuning a style cares about.

   Now it is ONE set of twelve, pulled from the library like everything else,
   and every slot is swappable: click a name to select it, search by title,
   pick a result. Nothing above this block changed. These declarations hoist
   over the originals, so the engine keeps calling the same names.
   ====================================================================== */

/** The anatomy pilot group, so the styling work and the anatomy work are
 *  looking at the same twelve icons. */
/* Three canvases, because a pipeline behaves differently on each and a tool
   that only ever shows one will look finished while being wrong elsewhere.

   icons          Product and app together. Small, dense, mostly gradients.
   illustrations  Four at 2x2. Twenty times the shape count and drawn under
                  different rules, which is where a luminance-bucketing
                  pipeline falls apart first.
   custom         Twelve, two from each family, so every kind of artwork in the
                  library is on screen at once and any of them can be swapped
                  out. Includes a mark that is a single black path, so "there
                  is nothing here to theme" is visible on the canvas rather
                  than something you have to be told. */
var SETS = {
  icons: [
    'product.word', 'product.excel', 'product.powerpoint',
    'product.copilot', 'product.teams', 'product.outlook',
    'app.photos', 'app.calculator', 'product.edge',
    'app.paint', 'product.swiftkey', 'app.file-explorer',
  ],
  illustrations: [
    'oobe.desktop', 'oobe.msa-sign-up', 'm365.celebration', 'm365.chat',
  ],
  custom: [
    'product.teams', 'product.copilot', 'app.paint', 'app.calculator',
    'file.excel', 'file.pdf', 'third-party.figma', 'third-party.slack',
    'device.generic-laptop', 'm365.celebration', 'oobe.desktop', 'product.github',
  ],
};
var SET_DEFAULT = SETS.icons;

var SET = [];
var picking = -1;
var setKind = 'icons';

/** Largest standard drawing: these pipelines bucket by luminance and read
 *  better with more shapes to work from. */
async function fetchAsset(id) {
  const asset = LIB.byId.get(id);
  if (!asset) return null;
  const sizes = Object.keys(asset.variants.standard);
  const pick = sizes.includes('any') ? 'any' : String(Math.max(...sizes.map(Number).filter(Number.isFinite)));
  const path = asset.variants.standard[pick];
  try {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    // roles ride along so the Roles pipeline has the declared answer
    return { id, name: asset.name, svg: resolveColorVars(await res.text()), roles: asset.roles || null };
  } catch (err) {
    return null;
  }
}

async function loadSet(ids) {
  const loaded = await Promise.all(ids.map(fetchAsset));
  SET.length = 0;
  loaded.filter(Boolean).forEach((a) => SET.push(a));
}

async function setReset() {
  picking = -1;
  await loadSet(SETS[setKind] || SETS.icons);
  updateHint();
  renderIcons();
  renderThumbs();
}

/** Icons, illustrations, or one of everything. Each canvas keeps its own
 *  starting list, so Reset puts back what you were looking at rather than
 *  always snapping to the twelve icons. */
async function setSetKind(kind) {
  if (!SETS[kind]) return;
  setKind = kind;
  for (const k of Object.keys(SETS)) {
    const b = document.getElementById('set-' + k);
    if (b) b.classList.toggle('active', k === kind);
  }
  picking = -1;
  const search = document.getElementById('lib-search');
  if (search) search.value = '';
  const box = document.getElementById('lib-results');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  await loadSet(SETS[kind]);
  updateHint();
  renderIcons();
  renderThumbs();
}

function updateHint() {
  const hint = document.getElementById('set-hint');
  // The header counts what is actually on the canvas, which changes with the
  // toggle; it used to state the twelve it started with forever.
  const count = document.getElementById('canvas-count');
  if (count && Array.isArray(SET))
    count.innerHTML = 'Canvas &middot; ' + SET.length + ' ' +
      (setKind === 'illustrations' ? 'illustration' : 'asset') + (SET.length === 1 ? '' : 's');
  if (!hint) return;
  if (!Array.isArray(SET)) return;
  hint.textContent = picking >= 0 && SET[picking]
    ? 'Swapping ' + SET[picking].name + ', pick one below'
    : 'Click a name to swap it';
}

function selectSlot(i) {
  picking = picking === i ? -1 : i;
  updateHint();
  renderIcons();
  const search = document.getElementById('lib-search');
  if (picking >= 0 && search) search.focus();
}

var _setToken = 0;
async function renderIcons() {
  const row = document.getElementById('row-set');
  if (row) row.classList.toggle('illus', setKind === 'illustrations');
  // First call lands before the initialisers below have run: nothing to draw
  // yet, and loadLibrary calls back once the set is in.
  if (!row || !Array.isArray(SET)) return;
  const token = (_setToken = (_setToken || 0) + 1);
  const cells = await Promise.all(SET.map(async (a, i) => {
    const cell = await renderIconCell(a.name, a.svg, false, a, setKind === 'illustrations' ? 168 : 64);
    cell.classList.toggle('picking', i === picking);
    cell.title = 'Click to swap, right-click to download the SVG';
    cell.addEventListener('click', () => selectSlot(i));
    return cell;
  }));
  if (token !== _setToken) return;
  row.innerHTML = '';
  cells.forEach((c) => row.appendChild(c));
}

/** The library row is gone: a picked asset lands in the set itself. */
async function renderLibraryRow() {}

/** Rank by how early the match lands, so a title that starts with what you
 *  typed beats one that merely contains it. */
function libSearch(query) {
  const box = document.getElementById('lib-results');
  const q = query.trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
  const hits = [];
  for (const a of LIB.assets) {
    const at = (a.name + ' ' + a.id + ' ' + (a.keywords || []).join(' ')).toLowerCase().indexOf(q);
    if (at >= 0) hits.push([at, a]);
    if (hits.length > 400) break;
  }
  hits.sort((x, y) => x[0] - y[0] || x[1].name.localeCompare(y[1].name));
  box.hidden = false;
  box.innerHTML = hits.slice(0, 24).map(([, a]) =>
    '<button class="lib-hit" onclick="libAdd(&quot;' + a.id + '&quot;)">' + a.name +
    '<span class="lib-col">' + a.collection + '</span></button>'
  ).join('') || '<span class="lib-note">No match.</span>';
}

/** Named libAdd because the deep link from Gallery already calls it. */
async function libAdd(id) {
  const asset = await fetchAsset(id);
  if (!asset) {
    const note = document.getElementById('lib-note');
    if (note) { note.hidden = false; note.textContent = 'Could not load ' + id + '.'; }
    return;
  }
  if (picking >= 0) SET[picking] = asset;
  else SET.push(asset);
  picking = -1;
  const search = document.getElementById('lib-search');
  if (search) search.value = '';
  const box = document.getElementById('lib-results');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  updateHint();
  renderIcons();
  renderThumbs();
}

function libClear() {
  const search = document.getElementById('lib-search');
  if (search) search.value = '';
  const box = document.getElementById('lib-results');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  picking = -1;
  updateHint();
  renderIcons();
}

/** Export what is on the canvas, not a fixed list of built-ins. */
async function exportAllSvgs() {
  if (typeof JSZip === 'undefined') {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  const zip = new JSZip();
  const cfg = currentExportConfig();
  SET.forEach((a) => zip.file(buildExportFilename(a.name, cfg), svgForExport(transformSvg(a.svg, a.name, false))));
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const parts = [cfg.mode];
  if (cfg.modeOption) parts.push(cfg.modeOption);
  if (cfg.seed) parts.push(seedLabel(cfg.seed));
  parts.push(cfg.bg);
  a.href = url; a.download = 'expressive-assets_' + parts.join('_') + '.zip';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

async function loadLibrary() {
  try {
    const res = await fetch('manifest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const manifest = await res.json();
    LIB.assets = (manifest.assets || []).filter((a) => a.variants && a.variants.standard);
    LIB.assets.forEach((a) => LIB.byId.set(a.id, a));
    LIB.available = LIB.assets.length > 0;
  } catch (err) {
    LIB.available = false;
  }

  const label = document.getElementById('lib-label');
  const note = document.getElementById('lib-note');
  if (!LIB.available) {
    // fetch is blocked on file://, which is a normal state rather than a bug.
    note.hidden = false;
    note.textContent = 'Library not loaded. Open this page from the published site, or any local server, to pull assets from Expressive Assets.';
    return;
  }

  label.style.display = '';
  const search = document.getElementById('lib-search');
  search.placeholder = 'Search ' + LIB.assets.length.toLocaleString() + ' assets by name';
  search.addEventListener('input', () => libSearch(search.value));
  note.hidden = true;

  // Gallery deep-links here as customizer.html?asset=<id>, which opens the set
  // on what you clicked rather than on the default twelve.
  const asked = new URLSearchParams(location.search).getAll('asset');
  await loadSet(asked.length ? asked : SET_DEFAULT);
  updateHint();
  renderIcons();
  renderThumbs();
}

</script>
