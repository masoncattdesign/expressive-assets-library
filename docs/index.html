<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Expressive Assets — Windows Design Systems</title>
<meta name="description" content="Browse, filter, and download the Expressive Assets icon and illustration library for Windows Design Systems.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230078D4'/%3E%3Crect x='6' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='6' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='6' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3Crect x='13' y='13' width='5' height='5' rx='1.4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="chrome.js"></script>
<script>applyStoredTheme();</script>
</head>
<body>
<a class="skip" href="#grid">Skip to assets</a>

<div class="app">
  <!-- Sidebar ---------------------------------------------------->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="5" width="5.6" height="5.6" rx="1.6"/><rect x="5" y="13.4" width="5.6" height="5.6" rx="1.6"/><rect x="13.4" y="13.4" width="5.6" height="5.6" rx="1.6"/></svg>
      </div>
      <div class="brand-text">
        <strong>Expressive Assets</strong>
        <span>Windows Design Systems</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Collections"></nav>

    <div class="sidebar-foot">
      <a class="btn btn-primary block" id="contribute" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add Assets
      </a>
      <p class="version">
        <a href="about.html" target="_blank" rel="noopener">About</a>
        <span aria-hidden="true">&middot;</span>
        <span>Gallery 1.2</span>
      </p>
    </div>
  </aside>

  <!-- Main ------------------------------------------------------->
  <main class="main">
    <header class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.4 15.4 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search icons, illustrations, tags…" autocomplete="off" aria-label="Search assets">
      </div>

      <span class="count" id="count" aria-live="polite">38 assets</span>

      <label class="select">
        <span class="sr">Status</span>
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
          <option value="deprecated">Deprecated</option>
        </select>
      </label>

      <div class="segment view" role="group" aria-label="View mode">
        <button type="button" data-view="grid" class="on" aria-pressed="true" title="Grid view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.4" height="6.4" rx="1.6"/><rect x="13.6" y="4" width="6.4" height="6.4" rx="1.6"/><rect x="4" y="13.6" width="6.4" height="6.4" rx="1.6"/><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.6"/></svg>
        </button>
        <button type="button" data-view="list" aria-pressed="false" title="List view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.4" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="16" width="16" height="2.6" rx="1.3"/></svg>
        </button>
      </div>

      <span data-theme-switch></span>
      <span data-app-menu></span>
    </header>

    <div class="content">
      <section class="grid" id="grid" tabindex="-1" aria-label="Assets"></section>
      <aside class="panel" id="panel" hidden aria-label="Asset details"></aside>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js" type="module"></script>
</body>
</html>
